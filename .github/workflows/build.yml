name: Build crashdiag

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Fast type-check against the bundled stub SDK. Needs no engine SDK checkout.
  # ---------------------------------------------------------------------------
  lint:
    name: Syntax check (stub SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Type-check all sources
        run: |
          set -e
          for f in src/plugin.cpp src/crash_report.cpp src/heartbeat.cpp src/interface.cpp; do
            echo "== $f"
            g++ -std=c++17 -fsyntax-only -Wall -Wextra \
              -DCRASHDIAG_STUB_SDK -I src -I sdk/stub "$f"
          done

      - name: Full stub build (configure + link)
        run: |
          set -e
          cmake -S . -B build -DCRASHDIAG_STUB_SDK=ON
          cmake --build build --parallel

      - name: Verify exported entry points
        run: |
          set -e
          # The engine loads the plugin through CreateInterface; cvar is the
          # exported ICvar pointer seen in the recovered binary.
          nm -D --defined-only build/libcrashdiag.so | grep -E ' T CreateInterface$| B cvar$'

  # ---------------------------------------------------------------------------
  # Attempt real DoDS (Day of Defeat: Source) SDK builds, Win32 x86 and x64.
  #
  # 32-bit and 64-bit are separate binaries by necessity: a PE file records one
  # machine type, so srcds.exe (32-bit) and srcds_win64.exe (64-bit) each need
  # their own crashdiag.dll.
  #
  # Best-effort: the plugin was reconstructed from a compiled binary, so the
  # real hl2sdk-dods headers / ABI may differ from the stub signatures.
  #
  # Pinned to windows-2022: hl2sdk-dods (Source SDK 2013 era) hits
  # public/tier0/platform.h's "PORT: Code only tested with MSVC" #error on the
  # newer VS2026 toolset that windows-latest now ships (MSVC 19.52). VS2022's
  # 19.4x toolset is inside the range that header accepts.
  #
  # NOTE: job ids must not contain hyphens here - `needs.<id>.result` with a
  # hyphen is not a valid expression and makes the whole workflow file invalid.
  # ---------------------------------------------------------------------------
  dods:
    name: DoDS SDK build (Windows ${{ matrix.arch }})
    runs-on: windows-2022
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        arch: [32, 64]
    steps:
      - uses: actions/checkout@v5

      - name: Clone hl2sdk-dods (alliedmodders/hl2sdk, branch dods)
        run: |
          git clone --depth 1 --branch dods https://github.com/alliedmodders/hl2sdk.git deps/hl2sdk-dods
          if (Test-Path deps/hl2sdk-dods/public/eiface.h) {
            Write-Host "SDK headers present."
          } else {
            Write-Warning "public/eiface.h not found; SDK layout may differ."
          }

      - name: Build against hl2sdk-dods
        shell: cmd
        run: build.bat --sdk-path deps\hl2sdk-dods --arch ${{ matrix.arch }}

      - name: Show binary machine type
        shell: pwsh
        run: |
          # Confirms the artifact really is the architecture we asked for.
          $dll = Get-ChildItem -Recurse -Filter *.dll "build-win${{ matrix.arch }}" | Select-Object -First 1
          if (-not $dll) { throw "no .dll produced" }
          $bytes = [System.IO.File]::ReadAllBytes($dll.FullName)
          $offset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
          $name = switch ($machine) { 0x014c { 'i386 (32-bit)' } 0x8664 { 'AMD64 (64-bit)' } default { "0x$('{0:X4}' -f $machine)" } }
          Write-Host "$($dll.Name): $name"

      - name: Upload DoDS artifacts (if any)
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: dods-win${{ matrix.arch }}
          path: build-win${{ matrix.arch }}/**/*.dll

  # ---------------------------------------------------------------------------
  # Diagnostics: always report which jobs succeeded or failed.
  # ---------------------------------------------------------------------------
  diagnose:
    name: Build diagnostics
    if: always()
    needs: [lint, dods]
    runs-on: ubuntu-latest
    steps:
      - name: Report job outcomes
        run: |
          echo "lint = ${{ needs.lint.result }}"
          echo "dods = ${{ needs.dods.result }}"
          echo
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::Stub syntax check failed - the reconstructed sources do not compile."
            exit 1
          fi
          if [ "${{ needs.dods.result }}" != "success" ]; then
            echo "::warning::One or both DoDS builds did not succeed. This job is best-effort;"
            echo "            inspect the failed matrix leg for header/ABI mismatches."
          fi
