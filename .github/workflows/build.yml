name: Build crashdiag

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Stub SDK build: type-check + link a real shared object. This is the job that
  # proves the reconstructed sources compile; its binary is NOT loadable by a
  # real srcds (the stub SDK fakes tier0/ConVar).
  # ---------------------------------------------------------------------------
  lint:
    name: Syntax check (stub SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Type-check all sources
        run: |
          set -e
          for f in src/plugin.cpp src/crash_report.cpp src/heartbeat.cpp src/interface.cpp; do
            echo "== $f"
            g++ -std=c++17 -fsyntax-only -Wall -Wextra \
              -DCRASHDIAG_STUB_SDK -I src -I sdk/stub "$f"
          done

      - name: Full stub build (configure + link)
        run: |
          set -e
          cmake -S . -B build -DCRASHDIAG_STUB_SDK=ON
          cmake --build build --parallel

      - name: Verify exported entry points
        run: |
          set -e
          nm -D --defined-only build/libcrashdiag.so | grep -E ' T CreateInterface$| B cvar$'

  # ---------------------------------------------------------------------------
  # Real DoDS (Day of Defeat: Source) SDK header check, Win32 x86 and x64.
  #
  # COMPILE-ONLY by design. hl2sdk ships headers only: tier0.lib / tier1.lib
  # (ConMsg, Warning, Error, CommandLine_Tier0 ...) are not in the repo and must
  # be built separately the way SourceMod does. Linking against the SDK alone
  # therefore always ends in LNK2019, so this job verifies header/ABI
  # compatibility and leaves binary production to a build with real libs.
  #
  # 32-bit and 64-bit are separate compilations by necessity: the CONTEXT
  # layout and STACKFRAME64 machine type differ, and a single .dll cannot
  # serve both srcds.exe and srcds_win64.exe.
  #
  # Pinned to windows-2022 for a stable MSVC toolset.
  # NOTE: job ids must not contain hyphens - `needs.<id>.result` with a hyphen
  # is not a valid expression and invalidates the whole workflow file.
  # ---------------------------------------------------------------------------
  dods:
    name: DoDS SDK header check (Windows ${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [32, 64]
    steps:
      - uses: actions/checkout@v5

      - name: Clone hl2sdk-dods (alliedmodders/hl2sdk, branch dods)
        run: |
          git clone --depth 1 --branch dods https://github.com/alliedmodders/hl2sdk.git deps/hl2sdk-dods
          if (Test-Path deps/hl2sdk-dods/public/eiface.h) {
            Write-Host "SDK headers present."
          } else {
            throw "public/eiface.h not found - SDK layout changed"
          }

      - name: Compile against hl2sdk-dods
        id: build
        continue-on-error: true
        shell: cmd
        run: build.bat --sdk-path deps\hl2sdk-dods --arch ${{ matrix.arch }} --compile-only > build.log 2>&1

      # MSBuild diagnostics otherwise stay in the job log, which cannot be read
      # without repo credentials. Re-emit each one as a workflow error so the
      # failure is visible in the public checks API and on the run summary.
      - name: Surface compiler diagnostics
        if: steps.build.outcome != 'success'
        shell: pwsh
        run: |
          $log = Get-Content build.log
          $diag = $log | Select-String -Pattern 'error (C|LNK)\d+' | Select-Object -First 30
          foreach ($d in $diag) { Write-Host "::error::$($d.Line.Trim())" }
          if (-not $diag) {
            Write-Host "::error::build failed without a C####/LNK#### diagnostic; tail follows"
            $log | Select-Object -Last 25 | ForEach-Object { Write-Host $_ }
          }
          exit 1

      - name: Report object files
        shell: bash
        run: |
          set -e
          n=$(find build-win${{ matrix.arch }} -name '*.obj' | wc -l)
          echo "compiled objects: $n"
          test "$n" -gt 0

  # ---------------------------------------------------------------------------
  # Diagnostics: always report which jobs succeeded or failed.
  # ---------------------------------------------------------------------------
  diagnose:
    name: Build diagnostics
    if: always()
    needs: [lint, dods]
    runs-on: ubuntu-latest
    steps:
      - name: Report job outcomes
        run: |
          echo "lint = ${{ needs.lint.result }}"
          echo "dods = ${{ needs.dods.result }}"
          echo
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::Stub syntax check failed - the reconstructed sources do not compile."
            exit 1
          fi
          if [ "${{ needs.dods.result }}" != "success" ]; then
            echo "::error::One or both DoDS header checks failed - see the diagnostics annotation on the failed matrix leg."
            exit 1
          fi
