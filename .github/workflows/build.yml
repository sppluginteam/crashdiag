name: Build crashdiag

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Stub SDK build: type-check + link a real shared object. This is the job that
  # proves the reconstructed sources compile; its binary is NOT loadable by a
  # real srcds (the stub SDK fakes tier0/ConVar).
  # ---------------------------------------------------------------------------
  lint:
    name: Syntax check (stub SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Type-check all sources
        run: |
          set -e
          for f in src/plugin.cpp src/crash_report.cpp src/heartbeat.cpp src/interface.cpp src/log.cpp; do
            echo "== $f"
            g++ -std=c++17 -fsyntax-only -Wall -Wextra \
              -DCRASHDIAG_STUB_SDK -I src -I sdk/stub "$f"
          done

      - name: Full stub build (configure + link)
        run: |
          set -e
          cmake -S . -B build -DCRASHDIAG_STUB_SDK=ON
          cmake --build build --parallel

      - name: Verify exported entry points
        run: |
          set -e
          nm -D --defined-only build/libcrashdiag.so | grep -E ' T CreateInterface$| B cvar$'

  # ---------------------------------------------------------------------------
  # Real DoDS (Day of Defeat: Source) build, Win32 x86 and x64 - produces the
  # loadable crashdiag.dll for each architecture.
  #
  # hl2sdk ships headers only: tier0.lib (ConMsg, Warning, Error ...) and tier1.lib
  # (ConVar/ConCommand/InterfaceReg bodies) do not exist there. So the plugin does
  # not depend on either library: it keeps its own interface factory, supplies
  # layout-faithful ConVar/ConCommand bodies (src/compat/tier1_min.cpp), and logs
  # through IVEngineServer::LogPrint instead of ConMsg. Nothing else is linked
  # except the OS libraries dbghelp/psapi, which is what makes a real link possible
  # in CI.
  #
  # 32-bit and 64-bit are separate compilations by necessity: the CONTEXT
  # layout and STACKFRAME64 machine type differ, and a single .dll cannot
  # serve both srcds.exe and srcds_win64.exe.
  #
  # Pinned to windows-2022 for a stable MSVC toolset.
  # NOTE: job ids must not contain hyphens - `needs.<id>.result` with a hyphen
  # is not a valid expression and invalidates the whole workflow file.
  # ---------------------------------------------------------------------------
  dods:
    name: DoDS build (Windows ${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [32, 64]
    steps:
      - uses: actions/checkout@v5

      - name: Clone hl2sdk-dods (alliedmodders/hl2sdk, branch dods)
        run: |
          git clone --depth 1 --branch dods https://github.com/alliedmodders/hl2sdk.git deps/hl2sdk-dods
          if (Test-Path deps/hl2sdk-dods/public/eiface.h) {
            Write-Host "SDK headers present."
          } else {
            throw "public/eiface.h not found - SDK layout changed"
          }

      - name: Build crashdiag.dll against hl2sdk-dods
        id: build
        continue-on-error: true
        shell: cmd
        run: build.bat --sdk-path deps\hl2sdk-dods --arch ${{ matrix.arch }} > build.log 2>&1

      # MSBuild diagnostics otherwise stay in the job log, which cannot be read
      # without repo credentials. Re-emit each one as a workflow error so the
      # failure is visible in the public checks API and on the run summary.
      - name: Surface compiler diagnostics
        if: steps.build.outcome != 'success'
        shell: pwsh
        run: |
          $log = Get-Content build.log
          $diag = $log | Select-String -Pattern 'error (C|LNK)\d+' | Select-Object -First 30
          foreach ($d in $diag) { Write-Host "::error::$($d.Line.Trim())" }
          if (-not $diag) {
            Write-Host "::error::build failed without a C####/LNK#### diagnostic; tail follows"
            $log | Select-Object -Last 25 | ForEach-Object { Write-Host $_ }
          }
          exit 1

      - name: Verify PE machine type
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "build-win${{ matrix.arch }}" -Filter crashdiag.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw "crashdiag.dll not produced" }
          Write-Host "artifact: $($dll.FullName) ($($dll.Length) bytes)"
          $bytes = [System.IO.File]::ReadAllBytes($dll.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expected = if ("${{ matrix.arch }}" -eq "32") { 0x014c } else { 0x8664 }
          Write-Host ("machine = 0x{0:x4} (expected 0x{1:x4})" -f $machine, $expected)
          if ($machine -ne $expected) { throw "PE machine mismatch" }

      - name: Upload DLL
        uses: actions/upload-artifact@v5
        with:
          name: crashdiag-dods-win${{ matrix.arch }}
          path: build-win${{ matrix.arch }}/**/crashdiag.dll
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Diagnostics: always report which jobs succeeded or failed.
  # ---------------------------------------------------------------------------
  diagnose:
    name: Build diagnostics
    if: always()
    needs: [lint, dods]
    runs-on: ubuntu-latest
    steps:
      - name: Report job outcomes
        run: |
          echo "lint = ${{ needs.lint.result }}"
          echo "dods = ${{ needs.dods.result }}"
          echo
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::Stub syntax check failed - the reconstructed sources do not compile."
            exit 1
          fi
          if [ "${{ needs.dods.result }}" != "success" ]; then
            echo "::error::One or both DoDS build legs failed - see the diagnostics annotation on the failed matrix leg."
            exit 1
          fi
